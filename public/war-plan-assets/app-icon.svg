<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="WarPlan calendar icon">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F0E8"/>
      <stop offset="1" stop-color="#E7E6DD"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFC0B6"/>
      <stop offset="1" stop-color="#AFB0A6"/>
    </linearGradient>
    <linearGradient id="active" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A93425"/>
      <stop offset="1" stop-color="#8F281D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".18"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- original outer silhouette -->
    <rect x="68" y="78" width="376" height="360" rx="42" fill="#000000"/>

    <!-- original binder silhouette -->
    <rect x="125" y="36" width="48" height="112" rx="24" fill="#EFEEE6"/>
    <rect x="339" y="36" width="48" height="112" rx="24" fill="#EFEEE6"/>
    <rect x="132" y="39" width="34" height="100" rx="17" fill="#000000"/>
    <rect x="346" y="39" width="34" height="100" rx="17" fill="#000000"/>

    <!--
      Exact geometry:
      outer shell: x 68..444, bottom 438
      panel: x 93..419, bottom 413

      black frame:
      left   = 93 - 68  = 25
      right  = 444 - 419 = 25
      bottom = 438 - 413 = 25

      grid:
      4 × 3 cells, each 69 × 69
      gap between cells = 10
      gap from cells to panel edge = 10 on every side
    -->
    <rect x="93" y="166" width="326" height="247" rx="11" fill="url(#paper)"/>

    <g>
      <!-- row 1 -->
      <rect x="103" y="176" width="69" height="69" rx="9" fill="url(#cell)"/>
      <rect x="182" y="176" width="69" height="69" rx="9" fill="url(#cell)"/>
      <rect x="261" y="176" width="69" height="69" rx="9" fill="url(#active)"/>
      <rect x="340" y="176" width="69" height="69" rx="9" fill="url(#cell)"/>

      <!-- row 2 -->
      <rect x="103" y="255" width="69" height="69" rx="9" fill="url(#cell)"/>
      <rect x="182" y="255" width="69" height="69" rx="9" fill="url(#cell)"/>
      <rect x="261" y="255" width="69" height="69" rx="9" fill="url(#cell)"/>
      <rect x="340" y="255" width="69" height="69" rx="9" fill="url(#cell)"/>

      <!-- row 3 -->
      <rect x="103" y="334" width="69" height="69" rx="9" fill="url(#cell)"/>
      <rect x="182" y="334" width="69" height="69" rx="9" fill="url(#cell)"/>
      <rect x="261" y="334" width="69" height="69" rx="9" fill="url(#cell)"/>
      <rect x="340" y="334" width="69" height="69" rx="9" fill="url(#cell)"/>
    </g>
  </g>
</svg>
